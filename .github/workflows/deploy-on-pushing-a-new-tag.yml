name: Deploy and Release Plugin
on:
  push:
    tags:
      - "*"

jobs:
  tag:
    name: New tag
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Stop before touching wordpress.org if the tag (v2.0.0 or 2.0.0) does not
      # match the version in the plugin header, the main class and the readme.
      - name: Check version
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          TAG="${TAG#v}"
          HEADER=$(grep -m1 -E '^[[:space:]*]*Version:' dokan-customers.php | awk '{print $NF}' | tr -d '\r')
          CLASS=$(grep -m1 -oE "public \\\$version = '[^']+'" includes/DokanCustomers.php | sed -E "s/.*'([^']+)'/\1/")
          STABLE=$(grep -m1 -E '^Stable tag:' readme.txt | awk '{print $NF}' | tr -d '\r')
          echo "tag=$TAG header=$HEADER class=$CLASS stable=$STABLE"
          if [ "$TAG" != "$HEADER" ] || [ "$TAG" != "$CLASS" ] || [ "$TAG" != "$STABLE" ]; then
            echo "::error::Tag $TAG does not match plugin header ($HEADER), DokanCustomers::\$version ($CLASS) and readme Stable tag ($STABLE)."
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      # Setup PHP 7.4 with Composer
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer

      - name: Install dependencies
        run: composer install --optimize-autoloader --no-dev -q

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build assets
        run: |
          npm ci
          npm run build

      - name: WordPress Plugin Deploy
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}

      # Pushing a tag does not create a GitHub Release, so create one here with
      # this version's changelog as the notes and the deployed zip attached.
      # Re-running the workflow only replaces the zip on an existing release.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: ${{ steps.deploy.outputs.zip-path }}
        run: |
          ASSET="${RUNNER_TEMP}/dokan-customers-${VERSION}.zip"
          cp "$ZIP" "$ASSET"
          awk -v v="= ${VERSION} =" '$0 == v { f = 1; next } f && /^= / { exit } f' readme.txt > "${RUNNER_TEMP}/release-notes.md"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ASSET" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ASSET" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "${RUNNER_TEMP}/release-notes.md"
          fi
